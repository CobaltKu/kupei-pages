# 推到 main 就建置並部署到 GitHub Pages。
# 事前設定（repo Settings）：
#   Pages → Build and deployment → Source：GitHub Actions
#   Secrets and variables → Actions → Variables：VITE_KUPEI_BASE（後端網址）
# 不需要權杖 secret：網站必須用站長發的帳號登入，所有資料請求都用登入權杖，建置不帶任何權杖。
# npm run build 最後會跑 tools/check-dist-secrets.mjs，dist/ 裡出現像權杖的值就讓建置失敗、不部署。
name: deploy-pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # repo 名稱當子路徑；repo 叫 <帳號>.github.io 的話把這行改成 PAGES_BASE: /
          PAGES_BASE: /${{ github.event.repository.name }}/
          VITE_KUPEI_BASE: ${{ vars.VITE_KUPEI_BASE }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
